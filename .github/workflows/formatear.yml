name: Formatear Notion
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install notion-client
      - env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python formatear.py